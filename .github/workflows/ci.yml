# CI de api-gateway: pruebas (mvn clean verify), imagen de contenedor en GHCR y prueba de la plataforma completa con el
# aislamiento de red (workflow reutilizable de Deployment-Infrastructure, con este servicio en su commit).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn clean verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Pruebas unitarias y de integración
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  image:
    name: Imagen de contenedor
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Dockerfile común de los servicios Spring (Java 21, usuario sin privilegios).
      - uses: actions/checkout@v4
        with:
          repository: TRUCKCAR-APP/Deployment-Infrastructure
          path: .infra
          sparse-checkout: docker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .infra/docker/spring-service.Dockerfile
          push: true
          tags: |
            ghcr.io/truckcar-app/api-gateway:main
            ghcr.io/truckcar-app/api-gateway:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  platform:
    name: Plataforma
    needs: verify
    uses: TRUCKCAR-APP/Deployment-Infrastructure/.github/workflows/platform.yml@main
    with:
      service-repo: api-gateway
      service-ref: ${{ github.sha }}
    secrets: inherit
