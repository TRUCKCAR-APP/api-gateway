server:
  port: 8000

spring:
  application:
    name: ms-api-gateway

  cloud:
    gateway:
      # El gateway es el único responsable de CORS: no se reenvía Origin a los servicios
      # (varios declaran @CrossOrigin("*")). Las cabeceras CORS duplicadas de la respuesta se depuran en cada ruta
      # HTTP (filtro DedupeResponseHeader): en la ruta WebSocket la respuesta del upgrade es de solo lectura.
      default-filters:
        - RemoveRequestHeader=Origin
      routes:
        - id: user-identity-route
          uri: ${TRUCKCAR_USER_IDENTITY_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: fleets-drivers-route
          uri: ${TRUCKCAR_FLEETS_DRIVERS_URL:http://localhost:8081}
          predicates:
          - Path=/api/v1/fleets-drivers/**, /api/v1/fleets/**, /api/v1/drivers/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        # Telemetría GPS: el handshake WebSocket (STOMP) se reenvía a fleets-drivers. Con Upgrade: websocket el
        # gateway cambia http:// por ws:// automáticamente. El JWT llega como ?access_token= y se quita al validar.
        # En Docker la URL es lb://fleets-drivers: cada conexión va a una réplica distinta (round-robin) y RabbitMQ
        # entrega la telemetría a todas.
        - id: fleets-drivers-telemetry-ws
          uri: ${TRUCKCAR_FLEETS_DRIVERS_URL:http://localhost:8081}
          predicates:
            - Path=/ws-telemetry, /ws-telemetry/**

        - id: community-alerts-route
          uri: ${TRUCKCAR_COMMUNITY_ALERTS_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/alerts/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: load-allocation-route
          uri: ${TRUCKCAR_LOAD_ALLOCATION_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/loads/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: routing-restrictions-route
          uri: ${TRUCKCAR_ROUTING_RESTRICTIONS_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/restrictions/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: ai-fleet-allocation-route
          uri: ${TRUCKCAR_AI_FLEET_ALLOCATION_URL:http://localhost:8085}
          predicates:
           - Path=/api/v1/fleet-allocation/**, /api/v1/fleet-allocations/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: route-ai-agent-route
          uri: ${TRUCKCAR_ROUTE_AI_AGENT_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/routes/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: notifications-route
          uri: ${TRUCKCAR_NOTIFICATIONS_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

app:
  jwt:
    secret: ${TRUCKCAR_JWT_SECRET:${JWT_SECRET:}}

gateway:
  cors:
    # Patrones de origen: en local cualquier puerto de localhost/127.0.0.1 (Live Server, nginx :5500, etc.).
    # En producción definir TRUCKCAR_CORS_ALLOWED_ORIGINS con el dominio real del frontend.
    allowed-origins: ${TRUCKCAR_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Puertos de los servicios que se balancean con lb://<servicio> (las instancias salen de DNS).
truckcar:
  loadbalancer:
    ports:
      fleets-drivers: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    # /actuator/gateway permite leer y registrar rutas (POST /actuator/gateway/routes/{id}); se desactiva del todo.
    gateway:
      enabled: false