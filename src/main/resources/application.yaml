server:
  port: 8000

spring:
  application:
    name: ms-api-gateway

  cloud:
    gateway:
      # El gateway es el único responsable de CORS: no se reenvía Origin a los servicios
      # (varios declaran @CrossOrigin("*")) y se depuran cabeceras CORS duplicadas en la respuesta.
      default-filters:
        - RemoveRequestHeader=Origin
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST
      routes:
        - id: user-identity-route
          uri: ${TRUCKDAR_USER_IDENTITY_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: fleets-drivers-route
          uri: ${TRUCKDAR_FLEETS_DRIVERS_URL:http://localhost:8081}
          predicates:
          - Path=/api/v1/fleets-drivers/**, /api/v1/fleets/**, /api/v1/drivers/**
        - id: community-alerts-route
          uri: ${TRUCKDAR_COMMUNITY_ALERTS_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/alerts/**

        - id: load-allocation-route
          uri: ${TRUCKDAR_LOAD_ALLOCATION_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/loads/**

        - id: routing-restrictions-route
          uri: ${TRUCKDAR_ROUTING_RESTRICTIONS_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/restrictions/**

        - id: ai-fleet-allocation-route
          uri: ${TRUCKDAR_AI_FLEET_ALLOCATION_URL:http://localhost:8085}
          predicates:
           - Path=/api/v1/fleet-allocation/**, /api/v1/fleet-allocations/**

        - id: route-ai-agent-route
          uri: ${TRUCKDAR_ROUTE_AI_AGENT_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/routes/**

        - id: notifications-route
          uri: ${TRUCKDAR_NOTIFICATIONS_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**

app:
  jwt:
    secret: ${TRUCKDAR_JWT_SECRET:${JWT_SECRET:}}

gateway:
  cors:
    # Patrones de origen: en local cualquier puerto de localhost/127.0.0.1 (Live Server, nginx :5500, etc.).
    # En producción definir TRUCKDAR_CORS_ALLOWED_ORIGINS con el dominio real del frontend.
    allowed-origins: ${TRUCKDAR_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway