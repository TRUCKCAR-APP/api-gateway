server:
  port: 8000

spring:
  application:
    name: ms-api-gateway
  # Copia el contexto de la traza (traceId/spanId) entre los hilos de Reactor para los logs.
  reactor:
    context-propagation: auto
  # Tickets del WebSocket de telemetría (WsTicketStore) y límite de intentos de /api/v1/auth (RequestRateLimiter). En
  # Kubernetes el host llega en SPRING_DATA_REDIS_HOST (ConfigMap truckcar-platform); en Docker, el contenedor redis.
  # Timeouts cortos: sin ellos Lettuce espera 60 s por comando y, con Redis caído, cada login quedaría colgado un minuto
  # antes de que el limitador lo deje pasar (fail-open).
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}

  cloud:
    gateway:
      # El gateway es el único responsable de CORS en las rutas HTTP: no se les reenvía Origin (varios servicios
      # declaran @CrossOrigin("*")) y las cabeceras CORS duplicadas de la respuesta se depuran (DedupeResponseHeader).
      # La ruta WebSocket sí conserva Origin: sin él, el cliente WebSocket de Netty inventa uno con la URL del pod
      # (http://<ip>:8081) y fleets-drivers rechaza el handshake (TRUCKCAR_WEBSOCKET_ALLOWED_ORIGINS). Su respuesta del
      # upgrade es de solo lectura, así que tampoco lleva DedupeResponseHeader.
      #
      # Límite de intentos (KAN-31): RequestRateLimiter con un token bucket por IP en Redis (RateLimitConfig). Las rutas
      # más específicas van primero: login tiene su propio cubo, más estricto que register/refresh, y el resto de
      # /auth/** y /users/** no tiene límite. Al agotarlo: 429 con JSON, Retry-After y X-RateLimit-* (RateLimitResponseFilter).
      # Si Redis no responde, el limitador deja pasar (fail-open) y lo cuenta truckcar_gateway_rate_limiter_fail_open_total.
      routes:
        - id: user-identity-login-route
          uri: ${TRUCKCAR_USER_IDENTITY_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/login
          filters:
            - RemoveRequestHeader=Origin
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${TRUCKCAR_RATE_LIMIT_LOGIN_REPLENISH_RATE:1}
                redis-rate-limiter.burstCapacity: ${TRUCKCAR_RATE_LIMIT_LOGIN_BURST_CAPACITY:5}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@clientIpKeyResolver}"
                deny-empty-key: true
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: user-identity-auth-route
          uri: ${TRUCKCAR_USER_IDENTITY_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/register, /api/v1/auth/refresh
          filters:
            - RemoveRequestHeader=Origin
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${TRUCKCAR_RATE_LIMIT_AUTH_REPLENISH_RATE:5}
                redis-rate-limiter.burstCapacity: ${TRUCKCAR_RATE_LIMIT_AUTH_BURST_CAPACITY:10}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@clientIpKeyResolver}"
                deny-empty-key: true
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: user-identity-route
          uri: ${TRUCKCAR_USER_IDENTITY_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
          filters:
            - RemoveRequestHeader=Origin
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: fleets-drivers-route
          uri: ${TRUCKCAR_FLEETS_DRIVERS_URL:http://localhost:8081}
          predicates:
          - Path=/api/v1/fleets-drivers/**, /api/v1/fleets/**, /api/v1/drivers/**
          filters:
            - RemoveRequestHeader=Origin
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        # Telemetría GPS: el handshake WebSocket (STOMP) se reenvía a fleets-drivers. Con Upgrade: websocket el
        # gateway cambia http:// por ws:// automáticamente. El JWT nunca va en la URL: la PWA pide antes un ticket de un
        # solo uso (POST /api/v1/telemetry/ws-ticket) y lo envía como ?ticket=, que el gateway canjea y retira.
        # En Docker la URL es lb://fleets-drivers: cada conexión va a una réplica distinta (round-robin) y RabbitMQ
        # entrega la telemetría a todas.
        - id: fleets-drivers-telemetry-ws
          uri: ${TRUCKCAR_FLEETS_DRIVERS_URL:http://localhost:8081}
          predicates:
            - Path=/ws-telemetry, /ws-telemetry/**

        - id: community-alerts-route
          uri: ${TRUCKCAR_COMMUNITY_ALERTS_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/alerts/**
          filters:
            - RemoveRequestHeader=Origin
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: load-allocation-route
          uri: ${TRUCKCAR_LOAD_ALLOCATION_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/loads/**
          filters:
            - RemoveRequestHeader=Origin
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: routing-restrictions-route
          uri: ${TRUCKCAR_ROUTING_RESTRICTIONS_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/restrictions/**
          filters:
            - RemoveRequestHeader=Origin
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: ai-fleet-allocation-route
          uri: ${TRUCKCAR_AI_FLEET_ALLOCATION_URL:http://localhost:8085}
          predicates:
           - Path=/api/v1/fleet-allocation/**, /api/v1/fleet-allocations/**
          filters:
            - RemoveRequestHeader=Origin
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: route-ai-agent-route
          uri: ${TRUCKCAR_ROUTE_AI_AGENT_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/routes/**
          filters:
            - RemoveRequestHeader=Origin
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        - id: notifications-route
          uri: ${TRUCKCAR_NOTIFICATIONS_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - RemoveRequestHeader=Origin
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

        # Plantillas de notificación (solo ADMIN: JwtAuthenticationFilter responde 403 a otro rol y Notifications lo
        # vuelve a exigir con @PreAuthorize).
        - id: templates-route
          uri: ${TRUCKCAR_NOTIFICATIONS_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/templates, /api/v1/templates/**
          filters:
            - RemoveRequestHeader=Origin
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST

app:
  jwt:
    secret: ${TRUCKCAR_JWT_SECRET:${JWT_SECRET:}}

gateway:
  cors:
    # Patrones de origen: en local cualquier puerto de localhost/127.0.0.1 (Live Server, nginx :5500, etc.).
    # En producción definir TRUCKCAR_CORS_ALLOWED_ORIGINS con el dominio real del frontend.
    allowed-origins: ${TRUCKCAR_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  # Orígenes de red (CIDR separados por coma) desde los que se aceptan conexiones: en AWS, las subredes del ALB.
  # Vacío = cualquier origen (Docker / desarrollo local). Ver TrustedSourceFilter.
  trusted-source-cidrs: ${TRUCKCAR_GATEWAY_TRUSTED_SOURCE_CIDRS:}
  # IP del cliente para el límite de intentos (RateLimitConfig). false (Docker/local): la IP de la conexión. Detrás del
  # ALB, true: la entrada de X-Forwarded-For que agregó el proxy de confianza, contando trusted-proxies desde la derecha
  # (1 = solo el ALB; 2 = túnel de Cloudflare + ALB). Sin esto, detrás del ALB todos los clientes compartirían un cubo.
  rate-limit:
    trust-forwarded-for: ${TRUCKCAR_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    trusted-proxies: ${TRUCKCAR_RATE_LIMIT_TRUSTED_PROXIES:1}

# Puertos de los servicios que se balancean con lb://<servicio> (las instancias salen de DNS).
truckcar:
  telemetry:
    # Vida del ticket del WebSocket: lo justo para abrir la conexión. Se borra en el primer uso.
    ws-ticket-ttl: ${TRUCKCAR_WS_TICKET_TTL:30s}
  loadbalancer:
    ports:
      fleets-drivers: 8081

# ── Observabilidad ──────────────────────────────────────────────────────────────────────────────
# El actuator escucha en un puerto propio (8090) que no se publica: :8000 solo sirve las rutas de la API, así que
# /actuator/prometheus queda accesible solo dentro de la red interna (Prometheus).
# Las trazas se exportan por OTLP al otel-collector cuando se define MANAGEMENT_OTLP_TRACING_ENDPOINT (en Docker,
# http://otel-collector:4318/v1/traces); sin ella no se exporta nada.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    # Sin Redis solo falla la apertura del WebSocket: la API REST sigue y el pod no debe salir de servicio.
    redis:
      enabled: false
  endpoint:
    # /actuator/gateway permite leer y registrar rutas (POST /actuator/gateway/routes/{id}); se desactiva del todo.
    gateway:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRUCKCAR_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  # [servicio,traceId,spanId] en cada línea de log.
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
