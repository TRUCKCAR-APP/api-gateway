server:
  port: 8000

spring:
  application:
    name: ms-api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"

      routes:
        - id: user-identity-route
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: fleets-drivers-route
          uri: http://localhost:8081
          predicates:
          - Path=/api/v1/fleets-drivers/**, /api/v1/fleets/**, /api/v1/drivers/**
        - id: community-alerts-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/alerts/**

        - id: load-allocation-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/loads/**

        - id: routing-restrictions-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/restrictions/**

        - id: ai-fleet-allocation-route
          uri: http://localhost:8085
          predicates:
           - Path=/api/v1/fleet-allocation/**, /api/v1/fleet-allocations/**

        - id: route-ai-agent-route
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/routes/**

        - id: notifications-route
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/notifications/**

app:
  jwt:
    secret: TruckDarSecretKeySecurityAuthenticationToken2026MasterKey!

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway